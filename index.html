<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MailMX Pro - Dashboard</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#030817;--card:#0b1224;--card2:#10182c;--line:#1b2941;
  --text:#f4f7ff;--muted:#8995aa;--blue:#4b83ff;--green:#08b77c;
  --purple:#a855f7;--yellow:#eab12c
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.header{height:84px;border-bottom:1px solid #172139;background:#050a18;display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:10}
.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#4c77ff,#274bd9);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 0 20px #2454dd55}
.brand b{display:block;font-size:20px}.brand small{color:#5f8cff;font-weight:800}
.spacer{flex:1}.nav,.logout{border:1px solid #1c3156;background:#09132b;color:#7aa8ff;border-radius:25px;padding:10px 15px}
.logout{background:#240d1a;border-color:#54213a;color:#ff7987}
.wrap{max-width:900px;margin:auto;padding:30px 20px 55px}
.alert,.card{border:1px solid var(--line);background:var(--card);border-radius:20px;margin-bottom:24px;overflow:hidden}
.alert{padding:22px;border-color:#72541b;background:linear-gradient(120deg,#1c1720,#171524)}
.alert b{color:#ffd34e}.alert p{margin:6px 0 0;color:#ddd;font-size:14px}
.alert .icon{float:left;width:48px;height:48px;border-radius:14px;background:#4c3517;display:grid;place-items:center;font-size:25px;margin-right:16px}
.channel{padding:24px;border-color:#06404b;background:linear-gradient(135deg,#07172a,#0a1528)}
.channel h3{color:#5fe5bb;margin:0 0 6px}.channel p{color:#8491a5;margin:0 0 18px}
.btn{border:0;border-radius:15px;padding:12px 18px;color:#fff;font-weight:800;width:100%;background:linear-gradient(90deg,#08a975,#0ab882)}
.welcome{padding:30px}.welcome h1{margin:0 0 8px;font-size:25px}.welcome h1 span{color:#5f9aff}.welcome p{color:#8e99ad;line-height:1.45;margin:0}.rate{margin-top:22px;padding:11px 15px;border:1px solid #1b3a6d;background:#0b1935;border-radius:15px;color:#e5e9f3}.rate span{color:#65a0ff}
.balance{padding:26px;border-left:5px solid var(--green)}.label{font-size:12px;color:#8d98aa}.amount{font-size:28px;color:#25e29e;font-weight:900;margin:6px 0 18px}
.stat{padding:28px;border-left:5px solid var(--blue);position:relative}.stat.purple{border-left-color:var(--purple)}.value{font-size:27px;font-weight:900;color:#75a8ff;margin:5px 0}.purple .value{color:#bd78ff}
.iconbox{position:absolute;right:26px;top:30px;width:52px;height:52px;border-radius:15px;background:#102a50;display:grid;place-items:center;font-size:24px}
.purple .iconbox{background:#29133f}
.big-action{padding:25px}.start{background:linear-gradient(90deg,#2866eb,#4c39e8)}
.history{padding:24px}.history h2{font-size:20px;margin:0 0 18px}.history h2 span{float:right;color:#8792a4;font-size:14px;font-weight:500}
.table{border:1px solid #1a2740;border-radius:16px;overflow:auto;min-height:135px}
table{width:100%;border-collapse:collapse;min-width:500px}th,td{padding:16px;text-align:left;border-bottom:1px solid #1a2740}th{color:#8d99ae;font-size:13px}td{color:#727d91}.empty{text-align:center;font-style:italic;padding:35px}
